version: 0.2
env:
  variables:
    GOOS: linux
    GOARCH: amd64
    CGO_ENABLED: "0"
    GOTOOLCHAIN: auto
    HOME: /tmp
    GOCACHE: /tmp/go-build-cache
    GOMODCACHE: /tmp/go-mod-cache

phases:
  install:
    commands:
      - go version
      - mkdir -p "$GOCACHE" "$GOMODCACHE"

  pre_build:
    commands:
      - echo "Preparing Go dependencies..."
      - go mod download
      - go mod verify

  build:
    commands:
      - echo "========== TEST PHASE STARTED =========="
      - go test ./...
      - echo "========== TEST PHASE PASSED =========="
      - echo "========== BUILD PHASE STARTED =========="
      - mkdir -p bin
      - go build -o bin/api-gateway ./cmd/api-gateway
      - go build -o bin/auth-service ./cmd/auth-service
      - go build -o bin/order-service ./cmd/order-service
      - go build -o bin/product-service ./cmd/product-service

  post_build:
    commands:
      - test -f Procfile
      - test -x bin/api-gateway
      - test -x bin/auth-service
      - test -x bin/order-service
      - test -x bin/product-service
      - echo "BUILD AND VALIDATION COMPLETED SUCCESSFULLY"

artifacts:
  base-directory: .
  files:
    - Procfile
    - bin/api-gateway
    - bin/auth-service
    - bin/order-service
    - bin/product-service
  discard-paths: no
