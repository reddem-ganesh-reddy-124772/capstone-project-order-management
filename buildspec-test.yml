version: 0.2

env:
  variables:
    GOTOOLCHAIN: auto
    HOME: /tmp
    GOCACHE: /tmp/go-test-cache
    GOMODCACHE: /tmp/go-test-mod-cache

phases:
  install:
    commands:
      - go version
      - mkdir -p "$GOCACHE" "$GOMODCACHE"

  pre_build:
    commands:
      - echo "Downloading Go dependencies..."
      - go mod download
      - go mod verify

  build:
    commands:
      - echo "Running Go test suite..."
      - go test ./...

  post_build:
    commands:
      - echo "TEST STAGE PASSED: Go test command completed successfully."

reports:
  go-test-reports:
    files:
      - "**/*"
    base-directory: .
    discard-paths: no
